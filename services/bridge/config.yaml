# 本机笔记桥配置（跑在你自己的电脑上）
#
# ★ PSK（预共享密钥）不要写在这里的明文。生产由服务环境注入 BRIDGE_PSK，
#   桥读取优先级：环境变量 BRIDGE_PSK > 下面的 psk 字段（仅本地开发兜底）。
#   同步改到服务器侧 .env 的 BRIDGE_PSK，两侧必须一致。
psk: ""

# ★ Work-Review 上游（跑在本机）—— 桥 /bridge/work-review/* 的转发目标
work_review_base_url: "http://127.0.0.1:49996"

# 笔记库（改成你自己的路径）
libs:
  - id: main
    name: 主仓库
    path: "./vault/主仓库"
    mode: ro            # 默认只读
    enabled: true
    include: ["*.md", "**/*.md"]
    exclude: []

  - id: review
    name: work review 日报
    path: "./vault/主仓库/work review日报"
    mode: ro
    enabled: true
    include: ["*.md", "**/*.md"]
    exclude: []

  - id: undo
    name: 复盘
    path: "./vault/主仓库/复盘"
    mode: ro
    enabled: true
    include: ["*.md", "**/*.md"]
    exclude: []

  # ★ 附件库：include 放开为「所有文件」（图片/PDF/音视频等），只读绝不回写。
  - id: attach
    name: obsidian 附件
    path: "./vault/obsidian附件"
    mode: ro
    enabled: true
    include: ["**/*"]
    exclude: []
